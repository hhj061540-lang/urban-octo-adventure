name: credit_card_viewer
description: "A Flutter web application to view card data from a static JSON file."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev.

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # If you want to bundle the JSON file locally as a fallback asset, 
  # you can declare it here (though serving from web/api/list-cc.json works directly via HTTP).
  assets:
    - web/api/list-cc.json
